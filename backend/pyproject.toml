[project]
name = "pulso-backend"
version = "0.1.0"
description = "Pulso modular monolith backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery[redis]>=5.6,<6",
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "feedparser>=6.0,<7",
    "httpx>=0.28,<1",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.2,<4",
    "redis>=6.4,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]
# Opt-in local embedding model (#25); not installed by `uv sync` or in the image.
embeddings = [
    "fastembed>=0.8,<0.9",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -m \"not celery_smoke and not local_embedding\""
markers = [
    "celery_smoke: requires a separately running Celery worker connected to Redis (see README)",
    "local_embedding: requires the optional embeddings group and a downloaded local model (see README)",
]
