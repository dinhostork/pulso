services:
  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      # These are container addresses, regardless of host-machine .env settings.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEWS_FETCH_ALLOW_PRIVATE_NETWORKS: ${NEWS_FETCH_ALLOW_PRIVATE_NETWORKS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Uses /health/ready (not /health/live): a meaningful local "is this
      # backend actually able to serve traffic" signal for `up --wait`, not
      # just "the process started". No service depends_on backend, so a
      # transient dependency outage here cannot cascade (issue #5).
      test:
        [
          "CMD", "python", "-c",
          "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEWS_FETCH_ALLOW_PRIVATE_NETWORKS: ${NEWS_FETCH_ALLOW_PRIVATE_NETWORKS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional and disabled by default startup; runs the same image/settings as
  # the worker, with no enabled product schedules (ADR-0005, issue #4). Only
  # one Beat instance must run against this file-based schedule at a time.
  beat:
    profiles: ["beat"]
    build:
      context: ./backend
    command:
      [
        "celery", "-A", "config", "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
        "--pidfile=",
      ]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEWS_FETCH_ALLOW_PRIVATE_NETWORKS: ${NEWS_FETCH_ALLOW_PRIVATE_NETWORKS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_DIAGNOSTIC_BEAT_ENABLED: ${CELERY_DIAGNOSTIC_BEAT_ENABLED:-false}
      # News ingestion schedules (issue #19), independent of the diagnostic
      # flag above. Beat itself stays profile-gated and off by default.
      NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-true}
      NEWS_POLL_DISPATCH_INTERVAL_SECONDS: ${NEWS_POLL_DISPATCH_INTERVAL_SECONDS:-300}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    # Redis here is a broker/result cache, not authoritative persistence
    # (ADR-0005); no AOF/RDB durability is required for this local stack.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6399}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: pulso_tests
      POSTGRES_USER: pulso_tests
      POSTGRES_PASSWORD: local-only-pulso-tests
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    # Separate instance and storage: never mount the development volume here.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pulso_tests -d pulso_tests"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
